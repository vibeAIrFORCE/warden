[project]
name = "warden"
version = "0.1.0"
description = "An open, policy-capped trading agent — brain / policy / settlement."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# the executor's signing path — install only when you intend to trade
hl = ["hyperliquid-python-sdk>=0.23"]
# the local decision-model slot (the 4B gate branch)
model = ["transformers>=4.44", "torch>=2.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
